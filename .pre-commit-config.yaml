# Install with `make setup` (installs pre-commit + commit-msg hooks).
# ruff and mypy run through uv so their versions come from backend/uv.lock,
# the same versions CI uses.
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^frontend-next/(\.next|node_modules)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, refactor, perf, test, docs, ci, chore, build, style, revert]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, backend)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
