name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: lint & test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest pytest-asyncio
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
