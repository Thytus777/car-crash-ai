name: release

# Build once, promote the same digest everywhere:
#
#   merge to main      -> build, scan, SBOM, attest, push ghcr.io/...:sha-<commit>
#                         -> deploy that digest to staging (+ smoke test)
#   release published  -> find the digest built for the tagged commit, verify its
#                         provenance, deploy it to production (the `production`
#                         environment requires a reviewer's approval)
#   manual dispatch    -> deploy any earlier digest to either environment: rollback
#
# Deploy jobs are skipped until the repository variable GCP_PROJECT_ID exists
# (scripts/setup_gcp.sh sets it), so the image pipeline works without a cloud.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        required: true
      digest:
        description: Image digest to deploy (sha256:..., from a previous run's summary or GHCR)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Never cancel a deploy halfway; queue per trigger instead.
  group: release-${{ github.event_name }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  build:
    name: build, scan and push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id '${{ steps.name.outputs.image }}:sha-${{ github.sha }}' -u)" = "10001"

      - name: Vulnerability scan (Trivy, fixable HIGH/CRITICAL block the push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-backend-${{ github.sha }}.spdx.json
          upload-release-assets: false

      - name: Push the scanned image
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            echo "\`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  staging:
    name: staging
    needs: build
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      digest: ${{ needs.build.outputs.digest }}

  resolve:
    name: resolve release digest
    if: github.event_name == 'release' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.find.outputs.digest }}
    steps:
      - name: Find the image built for the tagged commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # release-please publishes the release while main's build may still be
          # running, so wait for it rather than building a second, different image.
          for _ in $(seq 1 50); do
            if digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              break
            fi
            echo "waiting for $image:sha-$GITHUB_SHA ..."
            sleep 30
          done
          test -n "${digest:-}" || { echo "::error::no image for $GITHUB_SHA; did the main build fail?"; exit 1; }
          # Only promote what our own release workflow built from this repo.
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  production:
    name: production
    needs: resolve
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      digest: ${{ needs.resolve.outputs.digest }}

  manual:
    name: manual deploy / rollback
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      digest: ${{ inputs.digest }}
