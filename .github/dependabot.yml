# Weekly, grouped updates so dependency PRs arrive as a few reviewable batches.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        dependency-type: production
      python-dev:
        dependency-type: development
    ignore:
      # OpenCV 5 drops the bundled Haar cascades the labelling tool relies on.
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /frontend-next
    schedule:
      interval: weekly
      day: monday
    groups:
      # Majors arrive one per PR so each migration is reviewed on its own.
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node follows the Node major in .nvmrc, not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Python itself is upgraded deliberately (with .python-version and
      # requires-python), not by the weekly base-image bump.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /frontend-next
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node majors move with .nvmrc, deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
