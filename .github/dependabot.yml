# Weekly, grouped updates so dependency PRs arrive as a few reviewable batches.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        dependency-type: production
      python-dev:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /frontend-next
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: build
