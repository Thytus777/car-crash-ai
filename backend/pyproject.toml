[project]
name = "car-crash-ai"
# Not the release version (this virtual project is never published, and a real
# version here would change uv.lock on every release). The API version lives in
# app/__init__.py and openapi.json, both bumped by release-please.
version = "0.0.0"
description = "AI-powered vehicle damage detection and cost estimation"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "pillow>=11.0.0",
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "httpx2>=2.16.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "prometheus-client>=0.26.0",
    "pyyaml>=6",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.19",
    "open-image-models>=0.6,<0.7",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "hypothesis>=6.170.15",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]
# Streamlit demo UI (frontend/streamlit_app.py); not needed by the API.
demo = [
    "streamlit>=1.41.0",
]
loadtest = [
    "locust>=2.47.0",
]

[tool.uv]
default-groups = ["dev"]
package = false

# --- mypy ---------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "evals"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
filterwarnings = [
    # urllib3 (via trafilatura) warns about optional SOCKS support at import time.
    "ignore::urllib3.exceptions.DependencyWarning",
]
markers = [
    "unit: fast, deterministic, no network or real LLM (default `make test`)",
    "integration: FastAPI app via httpx.AsyncClient with fixture LLM responses",
    "e2e: runs against a deployed environment",
    "eval: runs the model pipeline on the labelled dataset",
    "real_triage: integration test that runs the real image-triage stage",
    "real_redaction: test that uses the real redaction path (models optional)",
]

[tool.coverage.run]
source = ["app", "evals"]
branch = true
# SQLAlchemy's async layer runs ORM code inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

# --- bandit -------------------------------------------------------------

[tool.bandit]
# B101: asserts here narrow types for mypy; none guards a security property,
# and the code doesn't run with -O.
skips = ["B101"]
